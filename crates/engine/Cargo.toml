[package]
name = "kmine-engine"
version.workspace = true
edition.workspace = true

[dependencies]
directories = "6"
rusqlite = { version = "0.38", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
